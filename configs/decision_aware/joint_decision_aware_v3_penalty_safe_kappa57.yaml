# 偏差罚金版最终安全策略评估合同。
# 冻结验证总榜使用的da_only + follow_da策略；report-only只做最终披露。
market: ERCOT
node: LZ_LCRA
data_version: v3
freq: 1h
context_len: 168
horizon_da: 24
horizon_rt: 4
da_issue_hour_local: 10
train_stride: 1
val_stride: 1
eval_stride: 1

split_train_start: "2020-01-01 00:00"
split_train_end: "2024-12-31 23:00"
split_val_start: "2025-07-01 00:00"
split_val_end: "2025-12-31 23:00"
split_test_start: "2026-01-01 00:00"
split_test_end: "2026-06-01 23:00"

use_deviation_penalty: true
joint_coordination_mode: follow_da
joint_da_signal_mode: da_only
bess_power_mw: 1.0
bess_energy_mwh: 4.0
bess_eta: 0.95
bess_init_soc_frac: 0.5
bess_kappa: 5.7
bess_soc_min: 0.4
bess_soc_max: 3.6
bess_e_cyc: 4.0
topk_k_charge: 3
topk_k_discharge: 3
rt_topk_k_charge: 0
rt_topk_k_discharge: 0
topk_spread_threshold: 6.0

joint_da_checkpoint: data/checkpoints/da_fusion_ablation_v2_penalty/f1_seed1/pilot_LZ_LCRA_best_full_dual.pt
joint_rt_at_da_checkpoint: data/checkpoints/rt_at_da_fusion_ablation/f1b_seed0/pilot_LZ_LCRA_best_full_dual.pt
joint_rt_checkpoint: data/checkpoints/rt_fusion_ablation/f0_seed0/pilot_LZ_LCRA_best_full_dual.pt
joint_allow_source_kappa_mismatch: false

joint_episode_days: 16
joint_validation_batch_days: 8
joint_prediction_loss_mode: source_anchor
joint_pred_weight_da: 0.5
joint_pred_weight_rt_at_da: 0.5
joint_pred_weight_rt: 1.0
joint_pred_weight_spread: 1.0
joint_alpha: 1.0
joint_da_proxy_mode: coupled_spread
joint_proxy_weight_spread: 1.0
joint_proxy_weight_rt: 1.0
joint_proxy_reduction: global_sum
joint_zo_direction_mode: orthogonal
joint_zo_feedback_mode: episode_scalar
joint_zo_rt_feedback_mode: episode_scalar
joint_zo_epsilon_spread: 5.0
joint_zo_epsilon_rt: 10.0
joint_zo_directions_spread: 8
joint_zo_directions_rt: 4
zo_rho: 0.05
zo_K: 2
pred_clamp: [-500.0, 10000.0]
joint_proxy_scale: 1.0
joint_beta_start: 0.001
joint_beta_end: 0.003
joint_beta_warmup_epochs: 4
joint_tail_weight: 0.0
joint_tail_fraction: 0.10
joint_selection_tail_weight: 0.0
joint_trainable_scope: price_head
joint_trainable_models: [da]
joint_separate_optimizers: true
joint_include_baseline_candidate: true
joint_disable_dropout: true
joint_amp_init_scale: 1.0
huber_delta: 1.0
pred_scale: 25.0
lr: 0.000005
weight_decay: 0.0
epochs: 8
grad_clip: 1.0
early_stop_patience: 3
use_amp: true
num_workers: 0
seed: 0
checkpoint_dir: data/checkpoints/joint_decision_aware_v3_penalty_safe_kappa57
bootstrap_samples: 2000
