# 滚动RT + 4小时前瞻MPC + 零阶决策感知训练（seed 0）。
market: ERCOT
node: LZ_LCRA
data_version: v3
freq: 1h
context_len: 168
horizon_da: 24
horizon_rt: 4
train_stride: 1
val_stride: 1
eval_stride: 1

use_dual_split: false
use_dual_settlement: false
use_deviation_penalty: false
rt_fusion_mode: source_attention

d_model: 128
n_heads_enc: 4
n_heads_fusion: 4
n_layers_enc: 2
n_layers_fusion: 2
dim_ff: 512
dropout: 0.1
use_rope: true

bess_power_mw: 1.0
bess_energy_mwh: 4.0
bess_eta: 0.95
bess_init_soc_frac: 0.5
bess_kappa: 5.7
bess_soc_min: 0.4
bess_soc_max: 3.6
bess_e_cyc: 4.0

alpha0: 1.0
beta0: 0.0
alpha_end: 1.0
beta_end: 0.005
pretrain_epochs: 0
anneal_epochs: 2
use_mse_loss: false
huber_delta: 1.0
pred_scale: 25.0
proxy_scale: 4.0
zo_rho: 0.05
zo_K: 2
pred_clamp: [-500.0, 10000.0]

lr: 0.0005
weight_decay: 0.01
batch_size: 32
epochs: 6
grad_clip: 1.0
early_stop_patience: 3
use_amp: true
monitor: val_rolling_mpc_revenue
num_workers: 0
checkpoint_dir: data/checkpoints/rt_mpc_independent_v1
seed: 0
