# ERCOT 15节点RT-at-DA：无lag168、从头训练、任务专属伪Huber。
market: ERCOT
data_version: v3
context_len: 168
horizon_da: 24
horizon_rt: 4
da_issue_hour_local: 10
train_stride: 1
val_stride: 1
eval_stride: 1

use_dual_settlement: true
use_dual_split: true
use_deviation_penalty: true
bess_power_mw: 1.0
bess_energy_mwh: 4.0
bess_eta: 0.95
bess_init_soc_frac: 0.5
bess_kappa: 5.7
bess_soc_min: 0.4
bess_soc_max: 3.6
bess_e_cyc: 4.0

global_use_entity_embeddings: true
global_num_nodes: 15
global_num_markets: 1
global_residual_anchor: none

d_model: 128
n_heads_enc: 4
n_heads_fusion: 4
n_layers_enc: 2
n_layers_fusion: 2
dim_ff: 512
dropout: 0.1
use_rope: true
da_fusion_mode: F1
rt_at_da_fusion_mode: F0
rt_fusion_mode: F1
pred_clamp: [-500.0, 10000.0]

global_training_loss: pseudo_huber
global_loss_delta: 1.0
global_trainable_scope: all
lr: 0.0002
weight_decay: 0.01
batch_size: 16
epochs: 20
grad_clip: 1.0
early_stop_patience: 7
global_keep_top_k_checkpoints: 2
global_use_lr_scheduler: true
global_lr_scheduler_factor: 0.5
global_lr_scheduler_patience: 2
global_min_lr: 0.00001
use_amp: true
num_workers: 0
seed: 0
checkpoint_dir: data/checkpoints/global_ercot_taskloss_rt_at_da_pseudohuber_v1
