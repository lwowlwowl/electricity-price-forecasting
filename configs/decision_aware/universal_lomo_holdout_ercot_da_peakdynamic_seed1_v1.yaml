global_trainable_scope: decoder_head
lr: 0.00005
weight_decay: 0.01
batch_size: 16
epochs: 6
grad_clip: 1.0
early_stop_patience: 6
global_keep_top_k_checkpoints: 7
global_use_lr_scheduler: false
global_lr_scheduler_factor: 0.5
global_lr_scheduler_patience: 2
global_min_lr: 0.00001
use_amp: true
num_workers: 0
seed: 1
checkpoint_dir: data/checkpoints/universal_lomo_holdout_ercot_da_peakdynamic_v1

