# 与seed 0 DA局部峰值幅度后训练完全同协议；只改变随机种子。
market: ERCOT
global_training_markets: [CAISO, NYISO, PJM]
data_version: v3
context_len: 168
horizon_da: 24
horizon_rt: 4
da_issue_hour_local: 10
da_issue_hour_local_by_market: {CAISO: 10, ERCOT: 10, NYISO: 5, PJM: 11}
train_stride: 1
val_stride: 1
eval_stride: 1
use_dual_settlement: true
use_dual_split: true
use_deviation_penalty: true
bess_power_mw: 1.0
bess_energy_mwh: 4.0
bess_eta: 0.95
bess_init_soc_frac: 0.5
bess_kappa: 5.7
bess_soc_min: 0.4
bess_soc_max: 3.6
bess_e_cyc: 4.0
global_use_entity_embeddings: false
global_num_nodes: 0
global_num_markets: 0
global_entity_conditioning_mode: post_fusion
global_normalization_mode: context_robust
global_sampling_mode: market_node_balanced
global_samples_per_market: 16350
global_validation_aggregation: market_macro
global_residual_anchor: none
d_model: 128
n_heads_enc: 4
n_heads_fusion: 4
n_layers_enc: 2
n_layers_fusion: 2
dim_ff: 512
dropout: 0.1
use_rope: true
da_fusion_mode: F1
