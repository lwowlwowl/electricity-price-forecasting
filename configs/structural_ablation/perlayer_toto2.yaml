# 逐层消融实验 - Toto-2.0 (6层)
# 逐一跳过每层，精确定位各层贡献
name: structural_perlayer_toto2
market: ERCOT
nodes_group: ablation
freq: 1h
context_len: 168
train_context_len: 3360  # LEAR 需要 ≥103 完整天校准，3360h≈140天
horizon: 24
data_start: 2025-01-01
data_end: 2026-06-05
backtest:
  test_start: 2025-07-01
  test_end: 2026-06-01
  stride_hours: 24
  # max_origins: 30  ← 连续 12 个月跑满，不限起报点
spike:
  quantile: 0.95
  mode: global
multivariate: false
structural_ablation:
  models: [toto2]
  ablations:
    - skip_layer_0
    - skip_layer_1
    - skip_layer_2
    - skip_layer_3
    - skip_layer_4
    - skip_layer_5
  include_baseline: true
  baseline_models: [Naive, SeasonalNaive, LEAR]
