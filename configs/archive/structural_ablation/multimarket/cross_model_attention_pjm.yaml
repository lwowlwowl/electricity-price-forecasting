# 跨模型对比：注意力消融
# 同时对三个模型做 attention 相关的消融，对比哪个模型最依赖注意力机制
name: structural_cross_attention_pjm
market: PJM
nodes_group: ablation
freq: 1h
context_len: 168
train_context_len: 3360  # LEAR 需要 ≥103 完整天校准，3360h≈140天
horizon: 24
data_start: 2025-01-01
data_end: 2026-06-05
backtest:
  test_start: 2025-07-01
  test_end: 2026-06-01
  stride_hours: 24
  # max_origins: 30  ← 连续 12 个月跑满，不限起报点
spike:
  quantile: 0.95
  mode: global
multivariate: false
structural_ablation:
  models: [toto2, chronos2, timesfm]
  ablations: [skip_attention, halve_heads]
  include_baseline: true
  baseline_models: [Naive, SeasonalNaive, LEAR]
