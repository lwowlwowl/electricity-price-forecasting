# 结构消融完整实验 - TimesFM-2.5 全消融扫描
name: structural_full_timesfm_pjm
market: PJM
nodes_group: ablation
freq: 1h
context_len: 168
train_context_len: 3360  # LEAR 需要 ≥103 完整天校准，3360h≈140天
horizon: 24
data_start: 2025-01-01
data_end: 2026-06-05
backtest:
  test_start: 2025-07-01
  test_end: 2026-06-01
  stride_hours: 24
  # max_origins: 30  ← 连续 12 个月跑满，不限起报点
spike:
  quantile: 0.95
  mode: global
multivariate: false
structural_ablation:
  models: [timesfm]
  ablations:
    - skip_attention
    - halve_heads
    - remove_rope
    - simplify_patch_emb
    - simplify_output_head
    - point_only
    - skip_ffn
    - skip_layernorm
    - truncate_front_half
    - truncate_front_quarter
    - truncate_back_half
  include_baseline: true
  baseline_models: [Naive, SeasonalNaive, LEAR]
