# ElecFM — 全 ERCOT 节点训练配置 (LoRA 版本)
# 使用 ERCOT 所有 15 个节点，每节点独立 P95 阈值
# 训练样本：~124,600，尖峰事件：~18,750
# LoRA 可训练参数：~4.3M（vs 原 79M），减少 95%
# 训练时间估算：约 7 小时（MPS），建议挂后台跑

market:       ERCOT
nodes:        # 全部 15 个 ERCOT 节点
  - HB_BUSAVG
  - HB_HOUSTON
  - HB_HUBAVG
  - HB_NORTH
  - HB_PAN
  - HB_SOUTH
  - HB_WEST
  - LZ_AEN
  - LZ_CPS
  - LZ_HOUSTON
  - LZ_LCRA
  - LZ_NORTH
  - LZ_RAYBN
  - LZ_SOUTH
  - LZ_WEST
freq:         1h
context_len:  168
horizon:      24

pretrained_id: google/timesfm-2.5-200m-pytorch

batch_size:           32
train_stride:         1      # 125K 样本，stride=1 保留全部

# LoRA 配置
use_lora:             true
lora_r:               8
lora_alpha:           16
lora_dropout:         0.05

# 训练参数（LoRA 模式下会自动调整）
# Stage 1: 实际使用 lr=1e-3 (1e-5 * 100), epochs=5 (10 // 2)
# Stage 2: 实际使用 lr=5e-5 (5e-7 * 100), epochs=20 (40 // 2)
stage1_epochs:        10
stage1_lr:            1.0e-5

stage2_epochs:        40
stage2_lr:            5.0e-7
stage2_lr_min:        5.0e-8

gradient_clip:        1.0
weight_decay:         0.01
early_stop_patience:  10
use_amp:              true

lambda_pinball:       0.8
lambda_spike:         0.2

stride_hours:         24
# max_origins: 30  ← 注释掉以跑满连续 12 个月；设置具体数字则限制起报点
spike_quantile:       0.95
tau_search_range:     [0.05, 0.95]
tau_search_step:      0.05

checkpoint_dir:       data/checkpoints/electfm_ercot_full_lora
