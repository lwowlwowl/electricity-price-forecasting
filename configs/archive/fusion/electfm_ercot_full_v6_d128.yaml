# ElecFM V6 CrossNodeAttention — d_attn=128 (更大的注意力维度)
# 参数量：CrossNodeAttention ~1.3M + spike_head 334K = ~1.6M
# 参数/样本比：1.6M / 8307 ≈ 193（偏高，验证是否过拟合更严重）

market:       ERCOT
nodes: [LZ_LCRA, LZ_WEST, LZ_RAYBN]
freq:         1h
context_len:  168
horizon:      24

pretrained_id: google/timesfm-2.5-200m-pytorch

cross_node_only:      true
spike_head_only:      false
use_lora:             false
cross_attn_dim:       128    # ← 变化点

batch_size:           32
train_stride:         1

stage1_epochs:        30
stage1_lr:            1.0e-3
stage2_epochs:        0
stage2_lr:            0.0
stage2_lr_min:        0.0

gradient_clip:        1.0
weight_decay:         0.01
early_stop_patience:  5
use_amp:              true

lambda_pinball:       0.8
lambda_spike:         0.2

stride_hours:         24
# max_origins: 30  ← 注释掉以跑满连续 12 个月；设置具体数字则限制起报点
spike_quantile:       0.95
tau_search_range:     [0.05, 0.95]
tau_search_step:      0.05

checkpoint_dir:       data/checkpoints/electfm_ercot_full_v6_d128
