# 消融 B：上下文长度（手册 §6）
# 只转动 context_len 一个旋钮：168 → 336 → 720（7天/14天/30天回看）
# 其余全部锁死在基准配置，回答"喂更长历史是否更准、边际收益拐点在哪"。
#
# 用法：python src/parameter_ablation/run_ablation.py configs/parameter_ablation/ablation_B_context.yaml

name: ablation_B_context
market: ERCOT
nodes_group: ablation
freq: 1h
context_len: 168             # 会被 ablate 覆盖，这里只是占位
train_context_len: 3360      # 树模型训练窗口固定（不随消融变化）
horizon: 24
data_start: 2025-01-01       # 连续测试期起点前 6 个月，给最长上下文留足历史
data_end: 2026-06-05

backtest:
  test_start: 2025-07-01
  test_end: 2026-06-01
  stride_hours: 24
  # max_origins: 30  ← 连续 12 个月跑满，不限起报点

models: [Naive, SeasonalNaive, LEAR, ETS, Theta, RandomForest, LightGBM, XGBoost, TimesFM, Chronos2, Toto, Toto2]

covariates: []

spike:
  quantile: 0.95
  mode: global

# ── 被消融的旋钮 ──────────────────────────────────────────────────────────────
ablate:
  key: context_len
  values: [168, 336, 720]
  labels: ["168h(7天)", "336h(14天)", "720h(30天)"]
  axis_label: "上下文长度"
