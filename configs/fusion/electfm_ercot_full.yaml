# ElecFM — 全 ERCOT 节点训练配置
# 使用 ERCOT 所有 15 个节点，每节点独立 P95 阈值
# 训练样本：~124,600（vs 原 25K），尖峰事件：~18,750（vs 原 1,250）
# 训练时间估算：约 13 小时（MPS），建议挂后台跑

market:       ERCOT
nodes:        # 全部 15 个 ERCOT 节点
  - HB_BUSAVG
  - HB_HOUSTON
  - HB_HUBAVG
  - HB_NORTH
  - HB_PAN
  - HB_SOUTH
  - HB_WEST
  - LZ_AEN
  - LZ_CPS
  - LZ_HOUSTON
  - LZ_LCRA
  - LZ_NORTH
  - LZ_RAYBN
  - LZ_SOUTH
  - LZ_WEST
freq:         1h
context_len:  168
horizon:      24

pretrained_id: google/timesfm-2.5-200m-pytorch

batch_size:           32
train_stride:         1      # 125K 样本，stride=1 保留全部

stage1_epochs:        10
stage1_lr:            1.0e-5

stage2_epochs:        40
stage2_lr:            5.0e-7
stage2_lr_min:        5.0e-8

gradient_clip:        1.0
weight_decay:         0.01
early_stop_patience:  10
use_amp:              true

lambda_pinball:       0.8
lambda_spike:         0.2

stride_hours:         24
max_origins:          30
spike_quantile:       0.95
tau_search_range:     [0.05, 0.95]
tau_search_step:      0.05

checkpoint_dir:       data/checkpoints/electfm_ercot_full
