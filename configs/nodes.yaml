# ─────────────────────────────────────────────────────────────────────────────
# CAISO：仅 3 个节点（ablation = all）
# 测试期统计：std 22~25，负价格 6~13%（太阳能过剩），最高 722 $/MWh
# ─────────────────────────────────────────────────────────────────────────────
CAISO:
  ablation:
    - TH_SP15_GEN-APND    # 高波动：std=24.7，neg=12.7%（南加州，光伏最密集）
    - TH_NP15_GEN-APND    # 系统均价：mean=33.2（北加州，最稳定）
    - TH_ZP26_GEN-APND    # 高负价格：neg=12.2%（中部，与 SP15 差异化覆盖）
  all:
    - TH_NP15_GEN-APND
    - TH_SP15_GEN-APND
    - TH_ZP26_GEN-APND

