# 各市场节点配置
# 最后更新：2026-07-05（简化结构，基于测试期 2025-07-01~2026-06-01 统计）
#
# 两种用途：
#   ablation : 参数消融 + 结构消融（每市场 3 个代表节点，各市场统一）
#   all      : ElecFM 训练 + 测试（全部节点）
#
# 代表节点选取原则（对应 Lago 2021 checklist #5，论文方法部分说明）：
#   节点1：高波动（std 最高）      — 极端情况，模型差异最明显
#   节点2：系统均价（hub均价/RTO） — 最贴近实际调度场景
#   节点3：高负价格/极端尖峰      — 与本文 spike 预测主题最相关

# ─────────────────────────────────────────────────────────────────────────────
# ERCOT：15 节点
# 测试期统计：std 30~50，负价格 1.6~19.9%，最高价 1306 $/MWh
# ─────────────────────────────────────────────────────────────────────────────
ERCOT:
  ablation:
    - LZ_WEST      # 高波动：std=50.1（全市场最高），负价格 9.8%
    - HB_HUBAVG    # 系统均价：hub 均价节点，最接近系统平均
    - HB_PAN       # 高负价格：neg=19.9%（全市场最高），西部高风电/光伏区
  all:
    - HB_BUSAVG
    - HB_HOUSTON
    - HB_HUBAVG
    - HB_NORTH
    - HB_PAN
    - HB_SOUTH
    - HB_WEST
    - LZ_AEN
    - LZ_CPS
    - LZ_HOUSTON
    - LZ_LCRA
    - LZ_NORTH
    - LZ_RAYBN
    - LZ_SOUTH
    - LZ_WEST

